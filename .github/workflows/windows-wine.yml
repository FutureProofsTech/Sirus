name: Windows PE32+

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  pe32-wine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install Wine and mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64 mingw-w64 lld
      - name: Build and run the Win64/Wine gate
        run: ./scripts/windows-wine-check.sh

  pe32-native:
    # Staged native Windows-host gate. This job is not claimed as executed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-lld
      - name: Add mingw tools to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build and run native Win64 gate
        shell: bash
        run: ./scripts/windows-native-check.sh



  pe32-msvc-cfg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build protector before the MSVC environment
        shell: bash
        run: cargo build --release -p sirus-protector
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Locate llvm-pdbutil
        shell: bash
        run: |
          set -euo pipefail
          if command -v llvm-pdbutil >/dev/null 2>&1; then
            llvm-pdbutil --version
          else
            tool="$VCToolsInstallDir/Llvm/x64/bin/llvm-pdbutil.exe"
            test -x "$tool"
            "$tool" --version
          fi
      - name: Build and run the CFG victim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/cfg
          cmd //c "cl /nologo /O2 /Zi /guard:cf /c crates\\sirus-protector\\tests\\fixtures\\windows_victim.c /Fo:target\\cfg\\victim.obj"
          cmd //c "cl /nologo /DEBUG /guard:cf target\\cfg\\victim.obj /Fe:target\\cfg\\victim.exe /link /GUARD:CF /MAP:target\\cfg\\victim.map /PDB:target\\cfg\\victim.pdb"
          python scripts/msvc-cfg-symbols.py \
            target/cfg/victim.obj target/cfg/victim.map target/cfg/victim.pdb \
            | tee target/cfg/ranges.txt
          args=()
          while IFS='=' read -r name range; do
            args+=(--range "$range")
          done < target/cfg/ranges.txt
          ./target/release/sirus.exe protect \
            --input target/cfg/victim.exe \
            --output target/cfg/protected.exe \
            "${args[@]}" \
            --seed 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          target/cfg/victim.exe > target/cfg/native.out
          target/cfg/protected.exe > target/cfg/protected.out
          cmp target/cfg/native.out target/cfg/protected.out
          echo "PASS CFG-enabled native Windows PE"
