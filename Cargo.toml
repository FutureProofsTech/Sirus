[workspace]
resolver = "3"
members = [
    "crates/sirus-core",
    "crates/sirus-vm",
    "crates/sirus-binfmt",
    "crates/sirus-protector",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Sirus Project"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["obfuscation", "virtual-machine", "rust", "security"]
categories = ["development-tools", "compilers"]
publish = false

[workspace.dependencies]
sirus-core = { path = "crates/sirus-core" }
sirus-vm = { path = "crates/sirus-vm" }
sirus-binfmt = { path = "crates/sirus-binfmt" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_must_use = "deny"
unused_qualifications = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
noop_method_call = "warn"
meta_variable_misuse = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
alloc_instead_of_core = "deny"
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
float_arithmetic = "deny"
missing_inline_in_public_items = "deny"
exhaustive_structs = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug-assertions = false
incremental = false

[profile.proof]
inherits = "release"
debug = true
strip = false
